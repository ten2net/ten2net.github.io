本日情绪档位判为退潮。赚钱效应中位数处近期低分位，最高连板层级较前一交易日回落，炸板率抬升，跌超比例家数处近期高分位，情绪周期连续转弱。但连板溢价样本翻红且全市场板位连续，局部高位仍有承接，并非全面冰点。成交额榜缺失，不能判断板块相对活跃。

## 当日读数

**情绪档位**：退潮 · 分析框架，不是客观事实

**涨跌家数**：1757 / 3366 · 上涨占比 34.3% · 全 A 5556 只

**昨日涨停今日表现**：-0.37% · 中位数 -1.81% · 翻红率 39.7%

**昨日涨停今日晋级**：19.0% · 昨日 63 只 → 今日涨停 12 只 · 最高 4 板

## 汇总研判

# 盘面研判

情绪档位：退潮

本日情绪档位判为退潮。赚钱效应中位数处近期低分位，最高连板层级较前一交易日回落，炸板率抬升，跌超比例家数处近期高分位，情绪周期连续转弱。但连板溢价样本翻红且全市场板位连续，局部高位仍有承接，并非全面冰点。成交额榜缺失，不能判断板块相对活跃。

## 华字辈概念

题材串中家数领先且标注扩散中，当日有最高连板层级与中间梯队样本，昨日部分样本继续涨停。 风险：归因非公司确认；样本内有炸板与跌停，不能证明全面承接。仅有当日标签不能判断新发酵或延续，同题材内部跨日联系本分项未提供。

## 出版

行业结构中有最高连板层级样本且早盘封板，关键事件记录最高标与首封，梯队中占据高位梯队。 风险：行业分类不等于题材主线，不能直接称炒作主线；本分项未提供同题材内部跨日联系。历史归档日期可能不连续，不能称逐日演化，身份更换不揭示换庄。

## 风险提示

反证与缺口：连板溢价翻红、封板质量中未炸占比高，只说明局部承接与样本结构，不证明派发；炸板回封仅描述榜单。缺口包括成交额榜获取失败，不能判断相对活跃；大赛道中AI算力等方向无匹配概念板块，本分项未提供；龙虎榜仅净买额与原因，席位明细未提供。常规涨跌幅品种与放宽涨跌幅品种晋级表现不同，需分开读，不能自行求和。

## 明日验证条件

limit_up_count 预期下降：若次日涨停家数较本日下降，则退潮读数延续；若回升且赚钱效应中位数转正，则退潮判断需修正为修复。不能把条件当无条件预测，也不由中间梯队缺档推出最高连板层级次日持平。

## 情绪面

该日情绪档位判为退潮。前一交易日涨停样本在复盘目标日多数下跌，赚钱效应中位数转负，且平均与中位数背离说明少数大涨拉高均值；首板晋级率处近期偏低分位，接力转弱。最高连板高度较前一交易日回落，炸板率抬升显示封板分歧加大。情绪周期相对分处区间低分位，最近走向连续转弱，但距低点天数与正在转强是不同概念。梯队上全市场各板位均有样本且结构连续，但属跨题材拼接，同题材内部接力本分项未提供，需待核实；高位梯队少量、中间梯队较厚、低位连板偏少。

反证：连板溢价样本显示前一交易日高位连板股在复盘目标日多数翻红、均值与中位均收涨，封板质量中多数全天未炸、早盘封板占比高，全市场板位连续，说明局部高位仍有承接，并非全面冰点。缺口：所述表现仅针对前一交易日涨停池，不是全市场；同题材内部跨日联系未提供，缺档不能证明最高标断板后无人承接；本分项未提供龙虎榜席位与资金明细。短线边界：复盘目标日成交额排名只说明相对活跃，无前期成交量比较，不称放量缩量或量价共振；炸板率只说明封板未住，封不住后的疼痛需看亏钱效应，而亏钱效应确有深跌与跌停样本且跌超比例家数处近期高分位。常规涨跌幅品种与放宽涨跌幅品种晋级表现不同，需分开读；风险警示品种的本分项未提供独立统计。

后续核验带前提：若次日首板晋级率仍处偏低分位、赚钱效应中位数继续为负、高位梯队继续断板且跌超比例家数仍处近期高分位，则退潮读数延续。反证：若首板晋级率回升、连板翻红率提高、炸板率回落且高位梯队重新拓展，则退潮判断需修正为修复。不能由中间梯队缺档直接推出最高板位次日持平，也不能把条件当无条件预测。核验还需补充同题材内部跨日联系与北交所样本，本分项未提供。

## 资金面

今日资金面材料显示，主力资金净流入方向以半导体、矿物制品为代表，半导体领涨品种慧智微在盘面涨停样本中被记为反复开板；净流出方向以软件服务为代表，多个科技与设备方向同样在净流出榜。盘面事实显示赚钱效应相关统计处于偏低位置，整体承接偏弱；但出版方向仍有高位梯队，半导体也有少量涨停记录。资金流入行业与涨停题材仅部分重叠，行业资金方向不能等同于全市场主线。

反证方面，软件服务行业虽在净流出榜，但IT服务方向个股南威软件仍被记录为首封且位于较高梯队，说明行业主力资金合计不揭示个股结构与是否承接。缺口方面，板块成交额榜获取失败，没有成交额排序，因此不能判断板块相对活跃或放量缩量；大赛道跟踪中AI算力、人形机器人、商业航天均无匹配概念板块，本分项未提供这些大赛道的近期强弱。

后续核验需带前提：若板块成交额榜恢复，且材料与半导体方向的成交额排序上升，可支持资金流入与活跃度共振；若成交额榜仍缺失，或材料方向涨停梯队未能延续，则只能维持观察。资金材料仅给出当日主力资金方向，近期累计数据缺失，不能判断多日趋势；且资金流与板块来自当前接口，并非独立历史快照，端点时间戳未单独核实，后续应核验时间戳与历史归档是否一致。全市场成交额与宽度数据由盘面事实提供，可作为对照，但不能替代板块成交额榜。

## 题材热点

本日样本限于沪深主板、创业板、科创板且原因全数覆盖的涨停股，源站编辑归因非公司确认，不含北交所；全市场宽度按剔除北交所全体另计，范围不同。题材串中“华”字辈归因家数领先，业绩增长、存储芯片随后，创新药、智能制造、业绩扭亏、光通信测试、液冷散热、印制电路板概念、人工智能应用、消费电子、射频前端均有分布。跨日看，“华”字辈延续并有高位梯队；印制电路板概念为高标独活；业绩扭亏等在对照覆盖样本未见，本日以初次涨停为主，只能称当日分支。题材串显示方向较多，归因集中度有限。

反证与缺口：外部检索未形成目录内可引用条目，仅标注未使用全网检索，故本分项未提供外部交叉验证，归因以同花顺题材串为准。封板质量显示部分个股全天未开板，也有炸板回封与午后回封；涨停时间早盘集中、午后偏少，说明分歧存在，但炸板与回封仅描述榜单样本结构，不能证明承接或派发。连板高度、赚钱效应较对照交易日转冷，炸板率上升；上述变化只说明统计转弱，不能推出次日方向。龙虎榜席位与个股买卖额材料本分项未提供，资金主体与净买额缺口不参与推断。

后续核验：若确认“华”字辈延续，需该名称类题材继续有样本涨停且高位梯队未断；若只剩初次涨停扩散而无连板承接，则仍为当日分支。对对照覆盖样本未见方向，若后续再次上榜并形成连板梯队，才支持新发酵，否则维持当日分支判断。关键事件中高位断板与反复开板仅说明封板分歧，不能揭示换庄或筹码接棒；出版、家居用品等仅是个股行业归属，不等于炒作主线。封板时间与炸板回封描述榜单结构，不推测交易策略。

## 龙虎榜游资

今日龙虎榜净买额样本中，净买额居前列的证券包括先导基电、江淮汽车等，原因涉及连续区间收盘涨幅偏离累计达标。优利德代表该类样本，电科思仪代表换手率阈值样本；奥佳华在涨幅偏离与换手率原因中均有记录，属不同统计窗口，不应合并。上榜原因仅说明披露情形，不等于接力或派发。

本分项未提供席位明细，不区分游资或机构；未提供行业分类与题材归属，样本行业分布无法核实，不能说明行业集中或主线发酵。上榜原因仅反映触发披露情形，净买额只反映当日买卖差额，不证明承接、派发、筹码稳定或资金扩散。累计偏离触发不等于连板或高位梯队，板位与最高标身份无法核实；缺少前期成交量，不能判断放量、缩量或量价共振。

后续应补充行业分类、席位明细、连续交易日板位与成交量序列。若新增行业与题材材料，才可描述行业分布；若显示机构或游资席位，才可区分资金主体。若仍只提供净买额与原因，则只能维持样本结构描述，不能推断游资或机构动向，也不能由中间梯队缺档推出次日表现。当前材料仅支持说明当日样本与原因结构，不支持参与倾向或买卖判断。

## 龙头跟踪

今日最高连板层级由新华文轩与大亚圣象占据；前者归属出版，后者归属家居用品。已归档历史最高标为华瓷股份，归属家居用品，层级高于今日，比较条目显示下行转冷。最高标身份更换；行业不等于题材，身份更换不揭示换庄或接棒。本分项仅收单份归档，其余未提供，不能称逐日演化。

反证与缺口：本分项未提供龙虎榜与净买额，不推测承接派发；成交额排名仅说明相对活跃，不得称放量或量价共振。昨日部分方向未再涨停，跨日缺失只能称当日分支，不称市场无该现象。历史高分位与中间梯队缺档都不能推出次日涨跌或最高板位持平。

后续核验：若次日出版与家居用品高位梯队个股仍处最高连板层级且晋级样本未收缩，则支持延续；若高位梯队个股断板、深跌样本增加或涨停规模收缩，则反证延续并转冷。最高板位持平需等同标的记录齐备；本分项需补连续归档与资金明细才能判断换庄或筹码接棒，当前未提供。
